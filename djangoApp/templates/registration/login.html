{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
<div class="flex justify-center px-4 py-8">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 sm:p-8">
            <h2 class="text-xl font-bold text-gray-800 text-center mb-6">
                ログイン
            </h2>

            {% if form.errors %}
            <div class="mb-5 p-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-md">
                ユーザー名またはパスワードを確認してください。
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5"
                        for="{{ form.username.id_for_label }}">
                        ユーザー名
                    </label>
                    <input
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5"
                        for="{{ form.password.id_for_label }}">
                        パスワード
                    </label>
                    <input
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        type="password" name="password" id="{{ form.password.id_for_label }}"
                        autocomplete="current-password" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button
                    class="w-full py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
                    type="submit">
                    ログイン
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-gray-200 space-y-3 text-center text-sm">
                <div>
                    <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:text-blue-800 hover:underline">
                        アカウントを作成する
                    </a>
                </div>
                <div>
                    <a href="{% url 'password_reset' %}" class="text-gray-600 hover:text-gray-800 hover:underline">
                        パスワードを忘れた場合
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
