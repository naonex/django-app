<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}django-app{% endblock %}</title>

    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>

    {% block additionalHead %}{% endblock %}
</head>

<body class="min-h-screen bg-gray-100">
    <nav class="bg-gray-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="{% url 'home:index' %}"
                    class="text-xl font-semibold text-white hover:text-gray-300 transition-colors">
                    Django App
                </a>
                <div class="flex items-center gap-3">
                    {% if user.is_authenticated %}
                    <span class="text-sm text-white">
                        {{ user.username }}
                    </span>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button
                            class="px-3 py-1.5 text-sm text-white border border-gray-400 rounded-md hover:bg-gray-700 transition-colors"
                            type="submit">
                            ログアウト
                        </button>
                    </form>
                    {% else %}
                    <a href="{% url 'login' %}"
                        class="px-3 py-1.5 text-sm text-white border border-gray-400 rounded-md hover:bg-gray-700 transition-colors">
                        ログイン
                    </a>
                    <a href="{% url 'accounts:register' %}"
                        class="px-3 py-1.5 text-sm text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors">
                        新規登録
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main>
        <!-- 画面見出し -->
        <h1 class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 text-2xl font-bold text-gray-800">
            {% block page_title %}{% endblock %}
        </h1>
        <!-- 画面コンテンツ -->
        {% block content %}{% endblock %}
    </main>
</body>

</html>
